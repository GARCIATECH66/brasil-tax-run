<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brasil Tax Run 2.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;background:linear-gradient(#d9f3ff,#f7fbff);font-family:Arial,sans-serif;color:#173b57}
.wrap{width:min(94vw,460px);text-align:center}h1{margin:0 0 4px;font-size:clamp(23px,6vw,32px)}.sub{margin:0 0 7px}
canvas{display:block;margin:auto;width:auto;height:min(700px,calc(100dvh - 180px));max-width:100%;aspect-ratio:3/5;border-radius:18px;border:4px solid #173b57;box-shadow:0 14px 35px rgba(0,0,0,.18);touch-action:none}
.row{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:10px 15px;font-weight:bold;background:#173b57;color:#fff;font-size:14px;cursor:pointer;min-height:42px}
.secondary{background:#fff;color:#173b57;border:2px solid #173b57}.hint{font-size:12px;margin-top:6px;opacity:.75}
@media(max-height:640px){h1{font-size:21px}.sub,.hint{display:none}canvas{height:calc(100dvh - 110px)}}
</style>
</head>
<body>
<div class="wrap">
<h1>🇧🇷 Brasil Tax Run</h1>
<p class="sub">Desvie dos impostos e preserve seu dinheiro!</p>
<canvas id="game" width="420" height="700"></canvas>
<div class="row"><button id="start">Começar</button><button id="sound" class="secondary">Som: ligado</button><button id="full" class="secondary">Tela cheia</button></div>
<div class="hint">Toque, clique ou pressione espaço para subir.</div>
</div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),start=document.querySelector('#start'),soundBtn=document.querySelector('#sound'),full=document.querySelector('#full');
let run=false,over=false,score=0,best=+localStorage.getItem('taxrun_best')||0,sound=localStorage.getItem('taxrun_sound')!=='off',frame=0,speed=2.6,pipes=[],audio;
const p={x:85,y:155,w:42,h:42,vy:0},taxes=['ICMS','ISS','PIS','COFINS','IR','IPI','IOF'];
function reset(){run=false;over=false;score=0;frame=0;speed=2.6;pipes=[];p.y=155;p.vy=0;start.textContent='Começar'}
function beep(f=440,d=.06){if(!sound)return;try{audio=audio||new(AudioContext||webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.value=.05;o.start();o.stop(audio.currentTime+d)}catch(e){}}
function flap(){if(over){reset();run=true}else if(!run)run=true;p.vy=-7.2;start.textContent='Jogando';beep(620,.05)}
c.onpointerdown=e=>{e.preventDefault();flap()};start.onclick=flap;
onkeydown=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}};
soundBtn.textContent='Som: '+(sound?'ligado':'desligado');soundBtn.onclick=()=>{sound=!sound;localStorage.setItem('taxrun_sound',sound?'on':'off');soundBtn.textContent='Som: '+(sound?'ligado':'desligado');if(sound)beep()};
full.onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){}};
function spawn(){const gap=174-Math.min(score*1.15,45),top=95+Math.random()*(420-gap);pipes.push({x:450,top,gap,w:74,tax:taxes[Math.floor(Math.random()*taxes.length)],passed:false})}
function hit(a,b){const z=5;return a.x+z<b.x+b.w&&a.x+a.w-z>b.x&&a.y+z<b.y+b.h&&a.y+a.h-z>b.y}
function collide(q){return hit(p,{x:q.x,y:0,w:q.w,h:q.top})||hit(p,{x:q.x,y:q.top+q.gap,w:q.w,h:700-q.top-q.gap})}
function end(){over=true;run=false;start.textContent='Jogar novamente';beep(150,.25);navigator.vibrate?.(120)}
function update(){if(!run||over)return;frame++;p.vy+=.42;p.y+=p.vy;if(frame%105===0)spawn();speed=2.6+Math.min(score*.045,2.3);for(const q of pipes){q.x-=speed;if(!q.passed&&q.x+q.w<p.x){q.passed=true;score++;beep(760,.05);if(score>best){best=score;localStorage.setItem('taxrun_best',best)}}if(collide(q))end()}pipes=pipes.filter(q=>q.x+q.w>-20);if(p.y<0||p.y+p.h>700)end()}
function bg(){const g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,'#8fd3ff');g.addColorStop(1,'#e9f9ff');x.fillStyle=g;x.fillRect(0,0,420,700);x.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<5;i++){const a=(i*110-frame*.25)%560-80,b=70+(i*92)%260;x.beginPath();x.arc(a,b,25,0,7);x.arc(a+28,b+5,20,0,7);x.arc(a-28,b+8,18,0,7);x.fill()}x.fillStyle='#98d97c';x.fillRect(0,635,420,65)}
function drawPipe(q){const g=x.createLinearGradient(q.x,0,q.x+q.w,0);g.addColorStop(0,'#ffcc4d');g.addColorStop(.5,'#ff8b2d');g.addColorStop(1,'#d85816');x.fillStyle=g;x.fillRect(q.x,0,q.w,q.top);x.fillRect(q.x,q.top+q.gap,q.w,700-q.top-q.gap);x.fillStyle='#a94113';x.fillRect(q.x-6,q.top-28,q.w+12,28);x.fillRect(q.x-6,q.top+q.gap,q.w+12,28);x.fillStyle='#57210f';x.font='bold 18px Arial';x.textAlign='center';x.fillText(q.tax,q.x+q.w/2,q.top-8);x.fillText(q.tax,q.x+q.w/2,q.top+q.gap+22);x.textAlign='left'}
function player(){x.save();x.translate(p.x+21,p.y+21);x.rotate(Math.max(-.35,Math.min(.55,p.vy*.04)));x.fillStyle='#ffe16b';x.strokeStyle='#173b57';x.lineWidth=3;x.beginPath();x.roundRect(-21,-21,42,42,10);x.fill();x.stroke();x.fillStyle='#173b57';x.font='bold 24px Arial';x.textAlign='center';x.fillText('R$',0,8);x.restore()}
function hud(){x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.roundRect(14,14,180,58,16);x.fill();x.fillStyle='#173b57';x.font='bold 20px Arial';x.fillText('Pontos: '+score,28,39);x.font='14px Arial';x.fillText('Recorde: '+best,28,60);x.fillStyle='rgba(23,59,87,.9)';x.beginPath();x.roundRect(240,18,165,46,14);x.fill();x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText('Salvo: R$ '+score*100,322,47);x.textAlign='left'}
function overlay(){if(!run&&!over){x.fillStyle='rgba(255,255,255,.94)';x.beginPath();x.roundRect(38,285,344,185,24);x.fill();x.fillStyle='#173b57';x.textAlign='center';x.font='bold 27px Arial';x.fillText('Pronto para sobreviver?',210,330);x.font='18px Arial';x.fillText('Passe pelos impostos',210,370);x.fillText('sem perder seu dinheiro.',210,398);x.font='bold 16px Arial';x.fillText('Toque para começar',210,440);x.textAlign='left'}if(over){x.fillStyle='rgba(12,31,45,.86)';x.fillRect(0,0,420,700);x.fillStyle='#fff';x.textAlign='center';x.font='bold 34px Arial';x.fillText('💸 Imposto pago!',210,250);x.font='22px Arial';x.fillText('Pontuação: '+score,210,305);x.font='18px Arial';x.fillText('Recorde: '+best,210,340);x.fillText('Toque para tentar novamente',210,390);x.textAlign='left'}}
function loop(){update();bg();pipes.forEach(drawPipe);player();hud();overlay();requestAnimationFrame(loop)}reset();loop();
</script>
</body>
</html>
