<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brasil Tax Run</title>
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#07111f;overflow:hidden}
#game{display:block;width:100vw;height:100vh;background:linear-gradient(#78c9ff,#e9f7ff 65%,#87b95d 65%,#444 66%)}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.box{width:min(650px,90vw);background:#0c1d31;color:#fff;padding:26px;border-radius:22px;text-align:center;box-shadow:0 20px 60px #0008}
h1{font-size:clamp(34px,7vw,68px);margin:0;color:#fff}
h1 span{color:#ffd84d}
p{color:#bfd0e4;line-height:1.5}
#start{display:inline-block;margin-top:18px;padding:16px 32px;border:0;border-radius:14px;background:#39df83;color:#062012;font-size:22px;font-weight:900;cursor:pointer}
#start:hover{filter:brightness(1.08)}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;pointer-events:none}
.card{background:#07111fdd;color:#fff;padding:10px 14px;border-radius:12px;min-width:150px}
.card b{display:block;font-size:12px;color:#9eb1c8}
.card span{font-size:22px;font-weight:900}
#msg{position:fixed;top:90px;left:50%;transform:translateX(-50%);color:#fff;font-size:24px;font-weight:900;text-shadow:0 3px 10px #000;white-space:nowrap}
#jump{position:fixed;right:18px;bottom:18px;width:80px;height:80px;border-radius:50%;border:2px solid #fff8;background:#07111fcc;color:#fff;font-size:34px;display:none}
@media(max-width:700px){#jump{display:block}.card{min-width:0;flex:1}.card span{font-size:17px}}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="hud">
  <div class="card"><b>PATRIMÔNIO</b><span id="money">R$ 100.000</span></div>
  <div class="card"><b>PONTOS</b><span id="points">0</span></div>
</div>
<div id="msg"></div>
<button id="jump">⬆</button>
<div id="menu">
  <div class="box">
    <h1>BRASIL <span>TAX RUN</span></h1>
    <p>Desvie de IPVA, IPTU, DARF, juros e multas. Pegue Bitcoin, cashback e restituição.</p>
    <p><b>Como jogar:</b> pressione ESPAÇO, seta ↑, clique na tela ou use o botão ⬆.</p>
    <button id="start">▶ INICIAR JOGO</button>
  </div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const menu=document.getElementById('menu'),start=document.getElementById('start');
const moneyEl=document.getElementById('money'),pointsEl=document.getElementById('points'),msg=document.getElementById('msg');
const jumpBtn=document.getElementById('jump');
const W=c.width,H=c.height,G=590;

let running=false,last=0,score=0,money=100000,speed=390,spawn=0,bonus=0;
let obs=[],coins=[],stage=1,stageTime=32,resting=false,restTime=0;
const p={x:150,y:G-76,w:58,h:76,vy:0,on:true};
const taxes=[['IPVA',3600,'#ef476f'],['IPTU',3100,'#f77f00'],['DARF',2500,'#c44569'],['JUROS',4400,'#7b2cbf'],['MULTA',2200,'#d62828']];
const gifts=[['₿',8000,'#f7931a'],['$',2800,'#42df88'],['R',5000,'#ffd84d']];
const stageRewards=[6000,8000,10000,12000,15000];

function reset(){
  score=0;money=100000;speed=390;spawn=.9;bonus=2.2;obs=[];coins=[];
  stage=1;stageTime=32;resting=false;restTime=0;
  p.y=G-p.h;p.vy=0;p.on=true;hud();
}
function hud(){
  moneyEl.textContent='R$ '+Math.max(0,Math.round(money)).toLocaleString('pt-BR');
  pointsEl.textContent=Math.floor(score).toLocaleString('pt-BR')+' • Etapa '+stage;
}
function say(t,color='#fff'){
  msg.textContent=t;msg.style.color=color;clearTimeout(say.t);
  say.t=setTimeout(()=>{if(!resting)msg.textContent=''},1200);
}
function jump(){if(running&&!resting&&p.on){p.vy=-740;p.on=false}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function startGame(){
  reset();menu.style.display='none';running=true;last=performance.now();
  requestAnimationFrame(loop);
}
function showStageBreak(){
  resting=true;restTime=8;
  const reward=stageRewards[Math.min(stage-1,stageRewards.length-1)];
  money+=reward;
  obs=[];coins=[];
  say('ETAPA '+stage+' CONCLUÍDA! + R$ '+reward.toLocaleString('pt-BR'),'#72efaa');
}
function nextStage(){
  resting=false;stage++;stageTime=34;
  speed=Math.min(560,390+(stage-1)*28);
  say('ETAPA '+stage+' — VAMOS DE NOVO!','#ffd84d');
}
function gameOver(){
  running=false;menu.style.display='flex';
  menu.querySelector('p').innerHTML='Fim de jogo! Você chegou à <b>etapa '+stage+'</b> e marcou <b>'+Math.floor(score).toLocaleString('pt-BR')+'</b> pontos.';
  start.textContent='▶ JOGAR NOVAMENTE';
}
function update(dt){
  if(resting){
    restTime-=dt;
    msg.textContent='DESCANSO • próxima etapa em '+Math.max(1,Math.ceil(restTime))+'s';
    msg.style.color='#ffd84d';
    if(restTime<=0)nextStage();
    hud();
    return;
  }

  stageTime-=dt;
  if(stageTime<=0){showStageBreak();return;}

  score+=speed*dt/9;
  p.vy+=1800*dt;p.y+=p.vy*dt;
  if(p.y>=G-p.h){p.y=G-p.h;p.vy=0;p.on=true}

  spawn-=dt;bonus-=dt;
  if(spawn<=0){
    let t=taxes[Math.floor(Math.random()*taxes.length)];
    obs.push({x:W+30,y:G-72,w:78,h:72,n:t[0],cost:t[1],col:t[2]});
    spawn=1.05+Math.random()*.8;
  }
  if(bonus<=0){
    let g=gifts[Math.floor(Math.random()*gifts.length)];
    coins.push({x:W+30,y:G-160-Math.random()*100,w:54,h:54,n:g[0],gain:g[1],col:g[2]});
    bonus=2.5+Math.random()*2.8;
  }

  obs.forEach(o=>{
    o.x-=speed*dt;
    if(hit(p,o)){money-=o.cost;o.x=-999;say('- R$ '+o.cost.toLocaleString('pt-BR')+' • Taxa da taxa!','#ff7785')}
  });
  coins.forEach(o=>{
    o.x-=speed*dt;
    if(hit(p,o)){money+=o.gain;o.x=-999;say('+ R$ '+o.gain.toLocaleString('pt-BR'),'#72efaa')}
  });

  obs=obs.filter(o=>o.x>-120);coins=coins.filter(o=>o.x>-100);
  hud();
  if(money<=0)gameOver();
}
function person(x,y,label){
  ctx.fillStyle='#17253a';ctx.fillRect(x-25,y+35,50,80);
  ctx.fillStyle='#efbd95';ctx.beginPath();ctx.arc(x,y+12,28,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x,y+3,27,Math.PI,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#8c1e25';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x,y+20,14,.1,Math.PI-.1);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.textAlign='center';ctx.fillText(label,x,y+108)
}
function draw(){
  let sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#75caff');sky.addColorStop(.66,'#eaf8ff');
  sky.addColorStop(.661,'#68a84e');sky.addColorStop(.72,'#68a84e');
  sky.addColorStop(.721,'#3b3f46');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#eee6d4';ctx.fillRect(850,320,260,100);
  ctx.fillStyle='#c7beaa';ctx.fillRect(940,220,25,100);ctx.fillRect(990,190,25,130);
  ctx.fillStyle='#76502f';ctx.fillRect(840,460,320,85);
  person(900,355,'PRESIDENTE');person(1000,355,'HADDAD');person(1100,355,'MINISTROS');
  ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('HA! HA! HA!',1000,335);

  ctx.fillStyle='#3b3f46';ctx.fillRect(0,G,W,H-G);
  ctx.strokeStyle='#f5df55';ctx.lineWidth=7;ctx.setLineDash([50,35]);
  ctx.beginPath();ctx.moveTo(0,G+60);ctx.lineTo(W,G+60);ctx.stroke();ctx.setLineDash([]);

  obs.forEach(o=>{
    ctx.fillStyle=o.col;ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';
    ctx.fillText(o.n,o.x+o.w/2,o.y+42)
  });
  coins.forEach(o=>{
    ctx.fillStyle=o.col;ctx.beginPath();ctx.arc(o.x+27,o.y+27,27,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#07111f';ctx.font='bold 28px Arial';ctx.textAlign='center';
    ctx.fillText(o.n,o.x+27,o.y+37)
  });

  ctx.fillStyle='#0d3b66';ctx.fillRect(p.x+10,p.y+26,40,42);
  ctx.fillStyle='#efbd95';ctx.beginPath();ctx.arc(p.x+30,p.y+16,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(p.x+17,p.y+31,27,22);
  ctx.fillStyle='#2f9e44';ctx.fillRect(p.x+19,p.y+34,23,7);

  // relógio da etapa
  ctx.fillStyle='rgba(7,17,31,.85)';ctx.fillRect(W-230,90,200,52);
  ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(resting?'DESCANSO':'TEMPO DA ETAPA',W-130,111);
  ctx.fillStyle=resting?'#ffd84d':'#72efaa';ctx.font='bold 24px Arial';
  ctx.fillText(Math.max(0,Math.ceil(resting?restTime:stageTime))+'s',W-130,136);

  if(resting){
    ctx.fillStyle='rgba(7,17,31,.72)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='bold 52px Arial';ctx.textAlign='center';
    ctx.fillText('ETAPA CONCLUÍDA',W/2,H/2-30);
    ctx.fillStyle='#ffd84d';ctx.font='bold 28px Arial';
    ctx.fillText('Respire. O próximo round começa em '+Math.max(1,Math.ceil(restTime))+' segundos.',W/2,H/2+20);
  }
}
function loop(now){
  if(!running)return;
  let dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop)
}
start.onclick=startGame;jumpBtn.onclick=jump;c.onclick=jump;
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}
});
reset();draw();
</script>
</body>
</html>
